<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Tags for the native App feel -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Match Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        h2 { margin: 0; }
        .alert-btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .match { background: #1e1e1e; padding: 16px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .team { font-size: 16px; font-weight: 600; }
        .score { font-size: 24px; font-weight: bold; color: #4ade80; }
        .status { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .live-indicator { color: #ef4444; animation: pulse 2s infinite; font-weight: bold; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>Live Matches</h2>
        <!-- This is the button that triggers the Apple permission popup -->
        <button class="alert-btn" onclick="subscribeToPush()">🔔 Goal Alerts</button>
    </div>

    <div id="matches">Loading match data...</div>

    <!-- ALL JavaScript must go inside these script tags -->
    <script>
        // --- PUSH NOTIFICATION SETUP ---
        const publicVapidKey = 'BG2qpZzherTlEzWal1RrdDR6vNe1Xt9JHptz3BoPLiYQhiMbUajepLFIP3oXZ6OqpqrTdDaqqYIz_nB7H9XqD8E'; 

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
        

        async function subscribeToPush() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                try {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') throw new Error('Permission denied');

                    const register = await navigator.serviceWorker.register('/score-app/sw.js');
                    
                    const swRegistration = await navigator.serviceWorker.ready;
                    
                    const subscription = await swRegistration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                    });
                    // 4. Send Subscription to Backend
                    await fetch('https://score-server-58ri.onrender.com/subscribe', {
                        method: 'POST',
                        body: JSON.stringify(subscription),
                        headers: { 'content-type': 'application/json' }
                    });

                    // (Eventually, this will send the sub to your Node.js backend)
                    console.log('Push subscribed successfully', subscription);
                    alert("Alerts enabled! You are subscribed.");
                    
                } catch (err) {
                    console.error('Push subscription failed:', err);
                    alert(err);
                    //alert("Could not enable alerts. Make sure you are using the app from your Home Screen, not Safari.");
                }
            } else {
                alert("Push notifications are not supported on this browser version.");
            }
        }

        // --- MATCH DATA SETUP ---
        const API_KEY = 'YOUR_API_KEY';
        const API_URL = 'https://api.football-data.org/v4/matches';

        async function fetchMatches() {
            try {
                const response = await fetch(API_URL, {
                    headers: { 'X-Auth-Token': API_KEY }
                });
                const data = await response.json();
                renderMatches(data.matches);
            } catch (error) {
                document.getElementById('matches').innerText = 'Matches will appear here once you add an API key.';
            }
        }

        function renderMatches(matches) {
            if (!matches || matches.length === 0) return;
            const container = document.getElementById('matches');
            container.innerHTML = '';
            
            matches.forEach(match => {
                const isLive = match.status === 'IN_PLAY' || match.status === 'PAUSED';
                const statusHtml = isLive 
                    ? `<span class="status live-indicator">${match.minute || ''}' LIVE</span>` 
                    : `<span class="status">${match.status.replace('_', ' ')}</span>`;

                const homeScore = match.score.fullTime.home ?? '-';
                const awayScore = match.score.fullTime.away ?? '-';

                container.innerHTML += `
                    <div class="match">
                        <div>
                            <div class="team">${match.homeTeam.name}</div>
                            <div class="team" style="margin-top: 8px;">${match.awayTeam.name}</div>
                            <div style="margin-top: 8px;">${statusHtml}</div>
                        </div>
                        <div>
                            <div class="score">${homeScore}</div>
                            <div class="score" style="margin-top: 8px;">${awayScore}</div>
                        </div>
                    </div>
                `;
            });
        }

        fetchMatches();
    </script>
</body>
</html>
